manifest_version = "0"
plugin_version = "0.1.2" # x-release-please-version
requires_tap = ">=0.3.1"
slug = "anchore"
name = "TAP Anchore"
description = "Anchore Enterprise vulnerability findings, SBOMs, VEX statements and inventory, read from its REST API and held on the grid as Anchore returns them."

# Tier-1 load order (req-tap-plugin-arch-dependencies). The Anchore nodes link to computing_core's
# image host, package and sbom_document, and the SBOM parser is computing_core's. Nothing in this
# scaffold imports it yet; the declaration is the plan, and the first change that imports or
# names a computing_core type makes it observed. Linking to compliance_core's vulnerability by
# edge (req-anchore-findings) is a vocabulary reference to review when those edges are added.
depends_on = [
  { slug = "computing_core", note = "image host (oci-digest realm), package and sbom_document the Anchore nodes link to; the SBOM parser" },
  { slug = "compliance_core", note = "ABOUT_VULNERABILITY__anchore targets compliance_core__compliance_vulnerability; the collector imports that model only to check a vulnerability exists with exactly the finding's identifier before linking, and writes no compliance_core node" },
]

# The author's DECLARED crypto posture (req-tap-plugin-manifest-v0-fips; spec-fips.md declare-vs-decide).
# The HTTP client (`requests`, req-anchore-client) uses the system OpenSSL through Python's ssl
# module; validate_plugin's crypto-providers report finds no non-validated provider in it.
[fips]
status = "compatible"

[models]
anchore__anchore_scanner = "tap_plugin.anchore.models.scanner.AnchoreScanner"
anchore__anchore_scan_run = "tap_plugin.anchore.models.scan_run.AnchoreScanRun"
anchore__anchore_finding = "tap_plugin.anchore.models.finding.AnchoreFinding"

[edges]
RUN_OF_SCANNER__anchore = "edges/RUN_OF_SCANNER__anchore.edge.json"
FOUND_ON_IMAGE__anchore = "edges/FOUND_ON_IMAGE__anchore.edge.json"
FOUND_IN_PACKAGE__anchore = "edges/FOUND_IN_PACKAGE__anchore.edge.json"
FOUND_IN_SBOM__anchore = "edges/FOUND_IN_SBOM__anchore.edge.json"
ABOUT_VULNERABILITY__anchore = "edges/ABOUT_VULNERABILITY__anchore.edge.json"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in - depends_on closure + self, offline, credential-free. The consumer flips self to editable."
sha256 = "8108683ab544585cff237745e37a6a5b43171aa02f0e9993b0f0b0e3f2e583ed"
