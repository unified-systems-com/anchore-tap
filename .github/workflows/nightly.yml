# Nightly self-test (req-tap-plugin-extdev-repo-ci-12).
#
# A THIN CALLER. Running this plugin against core `main` and turning a red night into one issue
# that the next green closes both live in core's reusable `plugin-nightly.yml`, so they are fixed
# once for every plugin.
#
# Only what cannot move lives here: the `schedule` trigger (a reusable workflow's own triggers
# are not consulted when it is called), the cron MINUTE, staggered per repo so the org's
# nightlies do not burst, the slug, the pin, and the grant. No `latest_ref`: the floor is
# proven on every push, and a hardcoded release ref goes stale.
name: nightly
on:
  schedule:
    - cron: "23 10 * * *"   # minute staggered per repo so the org's nightlies do not burst
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    uses: unified-systems-com/tap/.github/workflows/plugin-nightly.yml@af6c940e52bc68b50add3b9ff63e600da8265e58
    # REQUIRED on this job. GitHub checks every job of a called workflow, and of the workflows
    # IT calls, against this grant BEFORE starting anything, so a scope missing here fails the
    # whole run at startup with zero jobs and no log. `security-events: write` is plugin-ci's
    # SARIF upload; `issues: write` is the owner-issue job and is the only write in the tree.
    permissions:
      contents: read
      security-events: write
      issues: write
    with:
      plugin_slug: anchore
      assignee: notgeorge   # no CODEOWNERS in this repo: the org's maintainer login
      # 360 covers ONE measured run (hard-things Q80a), not a permanent limit. The parity
      # check's stock Django migrate took 4,004s here before 0.5.0's history migration
      # (tap#1288) and now runs past the 90-minute default; the final value follows that run.
      migrations_timeout_minutes: 360
