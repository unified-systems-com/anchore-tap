# Scheduled drift check (req-anchore-drift-ci).
#
# Fetches Anchore's published OpenAPI file, converts it to JSON, reduces it with the same
# reducer that built the committed extract, and FAILS when anything the plugin consumes has
# changed. Changes outside the consumed set are listed in the run summary and do not fail.
# The failing run is the whole signal: no issue is opened and nothing is written, so the only
# grant is `contents: read`. It watches the vendor's public file only, never an instance (an
# instance is the per-run self-test's job, and reading one from CI would need a credential here).
#
# No third-party action beyond checkout and no package install: the file is converted with the
# Ruby Psych loader that ships on the runner image, with aliases off (a YAML alias bomb cannot
# expand) and only plain scalar classes, and the reducer is standard-library Python.
name: anchore-drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPSTREAM_URL: https://docs.anchore.com/current/docs/api/specs/anchore_api_swagger.yaml
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch Anchore's published OpenAPI file
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 \
            --max-filesize 16777216 --max-time 60 --output "$RUNNER_TEMP/upstream.yaml" "$UPSTREAM_URL"
          # --max-filesize does not bind a response of unknown length, so check what arrived.
          size="$(wc -c < "$RUNNER_TEMP/upstream.yaml")"
          [ "$size" -le 16777216 ] || { echo "upstream file is $size bytes, over the 16 MiB limit" >&2; exit 2; }

      - name: Convert it to JSON
        run: |
          set -euo pipefail
          command -v ruby >/dev/null || { echo "ruby is not on this runner image" >&2; exit 2; }
          ruby -ryaml -rjson -rdate -e '
            doc = YAML.safe_load(File.read(ARGV[0]), permitted_classes: [Date, Time], aliases: false)
            File.write(ARGV[1], JSON.generate(doc))
          ' "$RUNNER_TEMP/upstream.yaml" "$RUNNER_TEMP/upstream.json"

      - name: Compare with the committed extract
        run: |
          set -euo pipefail
          python3 -m tap_plugin.anchore.contract.drift < "$RUNNER_TEMP/upstream.json" | tee -a "$GITHUB_STEP_SUMMARY"
