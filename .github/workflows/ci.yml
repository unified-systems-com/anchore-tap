# Thin caller of core's reusable per-repo CI (req-tap-plugin-extdev-repo-ci). Two pins,
# independent (req-tap-plugin-extdev-repo-ci-9): the `uses:` SHA pins WHICH validation
# logic runs; the plugin's manifest `requires_tap` pins WHICH core it runs against; the
# harness is core at the tag v<floor>, resolved by the workflow (req-tap-plugin-extdev-repo-ci-7).
# No `harness_ref` (that is an override for the nightly and debugging, never a PR default)
# and no `boot_profile` (retired form): the in-package tap_plugin/anchore/boot/ci.boot.json
# IS the opt-in, and conformance fails closed without it (req-boot-bootstrap-ci-record-6).
# The `uses:` pin is tap v0.5.0 (af6c940e52bc, 2026-11-25). The harness core comes from
# requires_tap (the floor tag), not from this pin, which only picks the workflow logic.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    # A job-level block replaces the top-level one, so it restates contents: read. GitHub checks
    # every permission a called workflow's jobs declare before any job starts; plugin-ci
    # uploads its dependency scan as SARIF, which needs security-events: write. This
    # grants upload to this repo's Security tab only, never code write.
    permissions:
      contents: read
      security-events: write
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@e4d2e5c144d629ba2a07bff0a2dde390ed132a01
    with:
      plugin_slug: anchore
